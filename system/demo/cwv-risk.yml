# Workflow для демонстрации cwv-risk в форке проекта (подставляется в базовую ветку демо-PR).
name: cwv-risk
on: pull_request
permissions:
  contents: read
  pull-requests: write
  issues: write # метки очереди замеров
jobs:
  cwv-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # история основной ветки — шкала проекта
      - uses: sirpeperoni/masters-thesis-cwv@main
        with:
          # только фронтенд-пути истории — как в конфигурации стенда для bentopdf
          paths: src public index.html package.json package-lock.json vite.config.ts
